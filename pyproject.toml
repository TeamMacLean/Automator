[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automator-tsl"
version = "3.0.0"
description = "Automated imaging of round Petri dishes/plates (90–100 mm): Raspberry Pi controller, web UI, and reference assets"
readme = "package.md"
license-files = [
    "LICENSE",
    "LICENSE-MIT",
    "LICENSE-CERN-OHL-S",
    "LICENSE-CC-BY-4.0",
    "documentation/Third_Party_Notices.md",
]
authors = [
    { name = "Rohan R" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "opencv-contrib-python==4.10.0.84",
    "Pillow==11.3.0",
    "Flask==3.0.3",
    "flask-wtf==1.2.2",
    "werkzeug==3.0.3",
    "Flask-SocketIO==5.5.1",
    "python-socketio==5.14.2",
    "eventlet==0.40.3",
    "requests==2.32.4",
    "python-dotenv==1.0.1",
    "qrcode==8.0",
    "segno==1.6.6",
    "zxing-cpp==2.2.0",
    "onnxruntime==1.18.0",
    "reportlab==4.2.0",
    "huggingface_hub==0.23.4",
]

[project.urls]
Repository = "https://github.com/rotsl/Automator"
Documentation = "https://rotsl.github.io/Automator/"

[project.optional-dependencies]
pi = ["picamera2==0.3.31", "RPi.GPIO==0.7.1", "gpiozero==2.0.1"]

[project.scripts]
automator-fetch-model = "dev2.fetch_model:main"

[tool.setuptools]
packages = ["dev2"]
include-package-data = true

[tool.setuptools.package-data]
dev2 = ["templates/index.html", "templates/index_qr.html", "templates/login.html", "static/*"]

[tool.setuptools.data-files]
"share/automator" = ["CITATION.cff"]
"share/automator/data" = ["data/calibration.json"]
"share/automator/raw" = ["raw/.gitkeep"]
