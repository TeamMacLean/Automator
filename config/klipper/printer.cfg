# ===============================================================
#   MKS Robin Nano V3.1 — COMPLETE CONFIG (Z Torque Hold at SAFE_Z)
# ===============================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_47003B001951343035323830-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1000
max_z_velocity: 100
max_z_accel: 100
square_corner_velocity: 1.0


# ===============================================================
#   X / Y / Z AXES WITH ENDSTOPS
# ===============================================================

# ------------------------- X AXIS ------------------------------
# Homes at RIGHT side (your mechanical layout)
[stepper_x]
step_pin: <REDACTED>
dir_pin: <REDACTED>
enable_pin: <REDACTED>
microsteps: 1
rotation_distance: 40
endstop_pin: <REDACTED>
position_endstop: 0              # home = X0 (right-most)
position_min: 0
position_max: 290                # software clamp
homing_speed: 160
homing_retract_dist: 0

# ------------------------- Y AXIS ------------------------------
# Homes at TOP side (your mechanical layout)
[stepper_y]
step_pin: <REDACTED>
dir_pin: <REDACTED>
enable_pin: <REDACTED>
microsteps: 1
rotation_distance: 40
endstop_pin: <REDACTED>
position_endstop: 0              # home = Y0 (top-most)
position_min: 0
position_max: 300                # software clamp
homing_speed: 160
homing_retract_dist: 0

# ------------------------- Z AXIS ------------------------------
# Homes at BOTTOM (endstop at Z0)
[stepper_z]
step_pin: <REDACTED>
dir_pin: <REDACTED>
enable_pin: <REDACTED>
microsteps: 1
rotation_distance: 40
endstop_pin: <REDACTED>
position_endstop: 0              # bottom = Z0 (ENDSTOP)
position_min: 0
position_max: 80
homing_speed: 180
homing_retract_dist: 0


# ===============================================================
#   SERVO / VACUUM / SOLENOID OUTPUTS
# ===============================================================

# ===============================================================
#   SERVO (MG996R) — Stable Config
# ===============================================================

[servo arm_rotate]
pin: <REDACTED>
maximum_servo_angle: 90

# Slightly reduced pulse range (prevents stall at 0°)
minimum_pulse_width: 0.0011
maximum_pulse_width: 0.0019

initial_angle: 90

# Vacuum pump (software PWM)
[output_pin vacuum_pump]
pin: <REDACTED>
pwm: True
hardware_pwm: False
cycle_time: 0.026
value: 0.05

# Solenoid valve (software PWM)
[output_pin solenoid_valve]
pin: <REDACTED>
pwm: True
hardware_pwm: False
cycle_time: 0.026
value: 0.05


# ===============================================================
#   MACROS
# ===============================================================

[gcode_macro _SAFE_SET]
gcode:
    {% set pin = <REDACTED>
    {% set val = params.VALUE %}
    SET_PIN PIN=<REDACTED>
    G4 P30

# ------------------------- SUCK + HOLD --------------------------
[gcode_macro SUCK_HOLD]
gcode:
    _SAFE_SET PIN=<REDACTED>
    _SAFE_SET PIN=<REDACTED>
    {action_respond_info("Suck+Hold")}

# ------------------------- HOLD (solenoid on only) --------------
[gcode_macro HOLD]
gcode:
    _SAFE_SET PIN=<REDACTED>
    G4 P60
    _SAFE_SET PIN=<REDACTED>
    {action_respond_info("Hold: pump OFF")}

# ------------------------- RELEASE ------------------------------
[gcode_macro RELEASE]
gcode:
    _SAFE_SET PIN=<REDACTED>
    _SAFE_SET PIN=<REDACTED>
    G4 P150
    _SAFE_SET PIN=<REDACTED>
    {action_respond_info("Released")}


# ===============================================================
#   SERVO ROTATION — SLOW + SAFE FOR LID HANDLING
# ===============================================================

[gcode_macro ROTATE]
gcode:
    {% set angle = params.ANGLE|float %}
    {% if 0 <= angle <= 90 %}
        SET_SERVO SERVO=arm_rotate ANGLE={angle}
        G4 P300
        {action_respond_info("Rotated to " ~ angle ~ "°")}
    {% else %}
        {action_respond_info("ANGLE must be 0–90")}
    {% endif %}

# ===============================================================
#   Z MOTOR TORQUE HOLD 
#   — Z holds torque ONLY when at SAFE_Z = 50 mm
#   — X/Y still release on idle
# ===============================================================

[idle_timeout]
timeout: 3600
gcode:
    {% if (printer.toolhead.position.z|float - 50.0)|abs < 0.05 %}
        # Hold torque ONLY for Z at SAFE_Z
        SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
        {action_respond_info("Holding Z torque")}
    {% else %}
        M84                               # release all steppers
        {action_respond_info("Motors released (except Z at SAFE_Z)")}
    {% endif %}


# ===============================================================
#   Mainsail / Moonraker Support
# ===============================================================

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
[display_status]

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    M400
    SAVE_GCODE_STATE NAME=PAUSE_state
    G91
    G1 Z5 F600
    G90
    PAUSE_BASE

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    CANCEL_PRINT_BASE

# ============================
#  FORCE SERVO = 90° ON STARTUP
# ============================
[delayed_gcode servo_startup_safe]
initial_duration: 0.5
gcode:
    # Servo must be at 90° BEFORE any homing
    SET_SERVO SERVO=arm_rotate ANGLE=90
    {action_respond_info("Startup servo forced to 90 degrees")}
