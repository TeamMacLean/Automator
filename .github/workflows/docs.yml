name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys; let an in-progress run finish before starting a new one
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Assemble docs tree
        run: |
          set -e
          mkdir -p docs/documentation/images docs/hardware/images docs/mechanical docs/config docs/stylesheets

          # Root-level pages
          cp README.md        docs/automator-project.md
          cp contributing.md docs/
          cp package.md       docs/
          cp LICENSE            docs/LICENSE.md
          cp LICENSE-CC-BY-4.0  docs/LICENSE-CC-BY-4.0.md
          cp LICENSE-CERN-OHL-S docs/LICENSE-CERN-OHL-S.md
          cp LICENSE-MIT        docs/LICENSE-MIT.md

          # Documentation section — preserve subdir so relative image links remain valid
          cp documentation/QuickStartGuide.md                      docs/documentation/
          cp documentation/HowToUseAutomator.md                  docs/documentation/
          cp documentation/HandOver.md                            docs/documentation/
          cp documentation/SECURITY.md                            docs/documentation/
          cp documentation/OS_and_Firmware_installation.md        docs/documentation/
          cp documentation/networkandprintsettings.md             docs/documentation/
          cp documentation/HARDWARE_BUTTONS_AND_SERVICES.md       docs/documentation/
          cp documentation/Security_Model_Credential_Management.md docs/documentation/
          cp documentation/diagnosticsserver.md                                     docs/documentation/
          cp documentation/raspberry-pi-automator-kiosk-admin-desktop.md            docs/documentation/
          cp documentation/Third_Party_Notices.md docs/documentation/Third_Party_Notices.md
          cp documentation/JPG_Cleanup_Workflow.md                   docs/documentation/
          [ -d documentation/images ] && cp -r documentation/images/. docs/documentation/images/ || true

          # Config section
          cp config/CONFIG.md docs/config/

          # Hardware section
          cp hardware/Hardware_Documentation.md docs/hardware/
          [ -d hardware/images ] && cp -r hardware/images/. docs/hardware/images/ || true

          # Mechanical section
          cp mechanical/mechanical_guide.md docs/mechanical/

      - name: Create custom stylesheet
        run: |
          cat > docs/stylesheets/extra.css << 'EOF'
          /* Body text: slightly larger and more open than the Material default */
          .md-typeset {
            font-size: 0.82rem;
            line-height: 1.7;
          }

          /* Heading weights */
          .md-typeset h1 {
            font-weight: 700;
            letter-spacing: -0.01em;
          }
          .md-typeset h2 {
            font-weight: 600;
          }
          .md-typeset h3 {
            font-weight: 600;
          }

          /* Code blocks: keep code slightly smaller than prose */
          .md-typeset code {
            font-size: 0.84em;
          }
          .md-typeset pre > code {
            font-size: 0.8rem;
          }

          /* Table header: filled with primary colour for readability */
          .md-typeset table:not([class]) th {
            background-color: var(--md-primary-fg-color);
            color: var(--md-primary-bg-color);
            font-weight: 600;
          }

          /* Tighten the top navigation tab bar slightly */
          .md-tabs__link {
            font-size: 0.72rem;
            font-weight: 500;
          }

          /* Footer: copyright link inherits the footer's lighter foreground */
          .md-footer .md-copyright a,
          .md-footer .md-copyright__highlight a {
            color: var(--md-footer-fg-color--lighter);
            text-decoration: underline;
            text-underline-offset: 2px;
          }
          .md-footer .md-copyright a:hover,
          .md-footer .md-copyright__highlight a:hover {
            color: var(--md-footer-fg-color);
          }
          EOF

      - name: Write mkdocs.yml
        run: |
          cat > mkdocs.yml << 'EOF'
          site_name: Automator
          site_description: Automated microbial plate imaging system
          site_url: https://rotsl.github.io/Automator/
          repo_url: https://github.com/rotsl/Automator
          repo_name: rotsl/Automator
          docs_dir: docs

          copyright: >-
            This Automator project was designed and developed by
            <a href="https://github.com/rotsl/Automator" target="_blank" rel="noopener">Rohan R</a>
            at The Sainsbury Laboratory, Norwich

          theme:
            name: material
            font:
              text: Inter
              code: JetBrains Mono
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: teal
                accent: teal
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: teal
                accent: teal
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
            features:
              - navigation.tabs
              - navigation.tabs.sticky
              - navigation.sections
              - navigation.expand
              - navigation.top
              - search.highlight
              - search.suggest
              - toc.follow
              - content.code.copy

          extra_css:
            - stylesheets/extra.css

          extra_javascript:
            - https://unpkg.com/mermaid@11/dist/mermaid.min.js

          markdown_extensions:
            - admonition
            - pymdownx.details
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
            - pymdownx.highlight:
                anchor_linenums: true
            - pymdownx.inlinehilite
            - tables
            - toc:
                permalink: true
                toc_depth: 3

          nav:
            - Home: documentation/QuickStartGuide.md
            - Detailed User Guide: documentation/HowToUseAutomator.md
            - Admin Guide: documentation/HandOver.md
            - Setup & Installation:
                - OS & Firmware Installation: documentation/OS_and_Firmware_installation.md
                - Network & Print Settings: documentation/networkandprintsettings.md
                - Configuration files (redacted credentials): config/CONFIG.md
            - Hardware:
                - Hardware Documentation: hardware/Hardware_Documentation.md
                - Mechanical Guide: mechanical/mechanical_guide.md
                - Buttons & Services: documentation/HARDWARE_BUTTONS_AND_SERVICES.md
            - Technical Reference:
                - Image storage and deletion: documentation/JPG_Cleanup_Workflow.md
                - Kiosk & Admin Desktop: documentation/raspberry-pi-automator-kiosk-admin-desktop.md
                - Diagnostics Server: documentation/diagnosticsserver.md
            - Security:
                - Security Policy: documentation/SECURITY.md
                - Security Model & Credentials: documentation/Security_Model_Credential_Management.md
            - Automator Package: package.md
            - Project:
                - Automator TSL Project: automator-project.md
                - Contributing: contributing.md
                - Punchcard (Internal Documentation): https://shorturl.at/Jth2Y
                - metrics-petri (PyPI): https://pypi.org/project/metrics-petri/
                - License:
                    - LICENSE: LICENSE.md
                    - LICENSE-CC-BY-4.0: LICENSE-CC-BY-4.0.md
                    - LICENSE-CERN-OHL-S: LICENSE-CERN-OHL-S.md
                    - LICENSE-MIT: LICENSE-MIT.md
                    - Third-Party Notices: documentation/Third_Party_Notices.md
          EOF

      - name: Build docs
        run: mkdocs build --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
