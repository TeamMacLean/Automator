#
# Manual-only release workflow. Publishes to PyPI via OIDC trusted
# publishing (no PyPI API token/secret stored in GitHub) using
# pypa/gh-action-pypi-publish. Before the first run, register this
# repository + workflow filename (and the "pypi" environment name below)
# as a trusted publisher for the project at
# https://pypi.org/manage/account/publishing/ (or, once the project
# exists, https://pypi.org/manage/project/<name>/settings/publishing/).

name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if 'version' is set)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      version:
        description: "Exact version to release, e.g. 0.1.0 (overrides 'bump' if set)"
        required: false
        type: string

concurrency:
  group: "release-pypi"
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/automator-tsl/
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compute new version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          python - <<'PYEOF'
          import os
          import re

          pyproject = open("pyproject.toml").read()
          current = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.M).group(1)

          override = os.environ.get("VERSION_OVERRIDE", "").strip()
          bump = os.environ.get("BUMP", "patch")

          if override:
              new = override
          elif bump == "none":
              new = current
          else:
              major, minor, patch = (int(p) for p in current.split("."))
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              new = f"{major}.{minor}.{patch}"

          print(f"Bumping {current} -> {new}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"current_version={current}\n")
              f.write(f"new_version={new}\n")
          PYEOF

      - name: Apply version bump
        if: steps.bump.outputs.new_version != steps.bump.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -e
          sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${NEW_VERSION}\"/" dev2/__init__.py

      - name: Commit and tag version bump
        if: steps.bump.outputs.new_version != steps.bump.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml dev2/__init__.py
          git commit -m "Bump package version to ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"

      - name: Install build tooling
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
